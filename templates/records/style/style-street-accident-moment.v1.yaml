content: |-
  适用：用于街头抓拍、意外泼洒、手机纪实和快速动作。
  Use when: Use for candid street moments, accidental spills, documentary phone shots, and fast action.
  要点 / Guidance:
  - Describe the exact moment, camera height, motion blur, and street context.
  - Add negative constraints for staged poses and fake ad lighting.
  - 描述具体瞬间、机位高度、运动模糊和街景。
  - 加入避免摆拍和广告棚拍感的限制。
  避坑 / Pitfalls:
  - Avoid too-clean compositions.
  - Keep the event plausible and grounded.
  - 避免画面过于干净。
  - 让事件看起来可信。
  可配合的模板骨架 / Skeletons: tpl-style-photo-1, tpl-style-photo-2
