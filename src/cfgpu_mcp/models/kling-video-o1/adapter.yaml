adapter_id: kling-video-o1
display_name: "Kling Video O1 (可灵 O1)"
cfgpu_model_id: kling-video-o1
model_name: kling-video-o1
task_type: video
endpoint: /video/generations
is_async: true
poll_endpoint: /video/tasks/{task_id}

# Material slots this model accepts — the single source for supports(), the
# profile catalog and the consistency tests (adapters/inputs.py). An absent slot
# is not accepted.
inputs:
  first_frame: {}
  last_frame: {}
  reference_images: {}    # image_list: no documented count limit
  # video_list, refer_type=feature. Editing (refer_type=base) is reached only through
  # model_specific, so the declared default is reference. No documented count limit.
  reference_videos: {role: reference}

# Canonical tasks (capabilities/media_tasks.yaml) — what this model can do, for
# both the code gates and the agent-facing profile catalog.
tasks:
  - text_to_video
  - image_to_video
  - first_last_frame
  - reference_to_video
  - video_edit
  - synced_audio_output

# Whether the output has sound (adapters/inputs.py AUDIO_OUTPUTS): sound: on/off ← with_audio.
outputs:
  audio: switchable

cost_tier: 4
speed_tier: 2
resolutions: [480p, 720p, 1080p]
# Accepted aspect_ratio values (upstream aspect_ratio enum (kling-v3-omni/reference); adaptive → 16:9). adaptive is always accepted.
aspect_ratios: ["16:9", "9:16", "1:1"]
# seconds: 3–15 (upstream enum); the fleet default minimum is 4.
# O1's ranges and defaults are taken from the V3 Omni doc (kling-v3-omni/reference),
# assumed identical until O1's own doc is available.
min_duration_seconds: 3

poll_config:
  base_interval: 5
  max_interval: 20
  backoff_factor: 1.3
  default_timeout: 3000
