content: |-
  适用：科学、教育、泛知识讲解；剪纸、立体书、分层纸雕、微缩定格。不适合普通二维卡通、线稿涂鸦或真人写实。
  画风基因：手工纸艺定格动画感；微缩纸雕舞台或剧场箱布景；多层卡纸剪裁，可见纸片厚度；哑光纸纹、纤维、折痕、缝隙、剪裁边缘；纸偶由独立纸片叠压组装；层间有真实投影；微距摄影感、轻微景深、2.5D 视差；标签、箭头、卡片、图表也用纸做。
  层次：多数镜头 4–7 层（前景、中景、背景、远景）；用纸叶、云纹、门框、帘幕做前景遮挡；核心知识对象放在最醒目的中景；文字较多的标签放在稳定层；背景也要有纸艺机关动效（纸云沿滑轨移动、纸月亮沿轨道运动、纸叶落下、纸灯笼轻晃、纸门打开）。
  动作：小幅分段移动、短暂停顿、轻微回弹、铰链关节、拉片揭示、滑轨、转盘、翻页、纸片落定；不用丝滑 CG 动作或大幅角色运动。
  运镜：缓慢推近进入纸艺世界、横移展示多层视差、固定中景、微距特写纸纹与关键道具、轻微俯视展示剖面、层间穿梭；避免高速飞行、无布景支撑的 360° 环绕、数码故障、液体融化变形。
  转场：翻页、立体书展开、抽拉标签、纸牌遮挡、纸云滑过、圆形纸片遮罩、剪纸门打开、剖面层分开、纸屑飞散、胶带或贴纸揭示。
  剪辑节奏：15 秒 4–6 镜（每镜 2–4 秒），30 秒 6–8 镜，60 秒 8–12 镜；每镜只讲一个知识节拍，标签卡出现时短暂停顿。
  声音：翻纸、剪纸、卡纸滑动、纸张摩擦、小木头卡扣、轻微弹出、胶带撕拉、纸偶关节轻响、纸盒打开、纸屑散落；配乐匹配主题文化（如中秋用古筝、琵琶、竹笛；一般科学用木琴、马林巴、拨弦），旁白下方压低。
  反向提示：光滑塑料 3D、高亮 CG、真人实拍、扁平矢量插画、无纸纹卡通、金属科幻表面、玻璃材质、赛博朋克霓虹、数码故障、油画笔触、真实毛发皮肤、无剪裁边缘、无层间投影、高速环绕、融化变形。
