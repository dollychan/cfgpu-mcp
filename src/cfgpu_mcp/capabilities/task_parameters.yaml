schema_version: 1

# Executable, agent-facing tool argument templates. A template carries values shared
# by every call; the agent adds the concrete image URL and optional creative prompt.
models:
  doubao-seedream-5-0-pro:
    layer_decomposition:
      call_template:
        prompt: ""
        n: 1
        model_specific:
          layer_decomposition: true
          size: auto
      requirements:
        reference_images:
          required: true
          min_items: 1
          max_items: 1
        prompt:
          required: true
          allow_empty: true
      supported_resolution: ["1K", "1.5K", "2K"]
      size:
        default: auto
        accepted: ["auto", "1K", "1.5K", "2K"]
        explicit_dimensions_supported: false
      result:
        urls:
          description: "Ordered output URLs: base image first, followed by independently editable transparent layers."
          layer_limit: 16
  doubao-seedream-5-0-flash:
    layer_decomposition:
      call_template:
        prompt: ""
        n: 1
        model_specific:
          layer_decomposition: true
          size: auto
      requirements:
        reference_images:
          required: true
          min_items: 1
          max_items: 1
        prompt:
          required: true
          allow_empty: true
      supported_resolution: ["1K", "1.5K", "2K"]
      size:
        default: auto
        accepted: ["auto", "1K", "1.5K", "2K"]
        explicit_dimensions_supported: false
      result:
        urls:
          description: "Ordered output URLs: base image first, followed by independently editable transparent layers."
          layer_limit: 16

  # Seedance-family video edit (2026-10-21). These models take the clip to edit on the
  # same reference_videos slot that reference generation uses (inputs role: reference),
  # so whether a call edits is decided by the prompt and, on 2.5, by ratio/duration.
  # Without a template an agent looking for "an edit model" saw only `role: reference`
  # and offered dedicated source-slot editors or a regenerate-from-keyframe route that
  # cannot keep camera motion or length. Contract source: wan-2-0 and
  # doubao-seedance-2-5 card.md (全模态子任务 table).
  doubao-seedance-2-5:
    video_edit:
      call_template:
        aspect_ratio: adaptive
        duration_seconds: -1
      requirements:
        reference_videos:
          required: true
          min_items: 1
          source_seconds: {min: 4, max: 30}
        prompt: &seedance_edit_prompt
          required: true
          guidance: "Name the clip to edit with [[handle]] (video_refs) and any replacement image the same way (image_refs); use an edit verb (替换/修改/增加/删除, replace/change/add/remove); state explicitly what must stay unchanged (camera move, framing, timing, background)."
      notes:
        - "aspect_ratio must stay adaptive and duration_seconds -1: any other ratio turns the call into reference generation (a new video, not an edit), and an explicit duration is refused for an edit. The output keeps the source clip's frame and length."
  doubao-seedance-2-0: &seedance_2_0_edit
    video_edit:
      call_template:
        aspect_ratio: adaptive
      requirements:
        reference_videos:
          required: true
          min_items: 1
        prompt: *seedance_edit_prompt
      notes:
        - "adaptive keeps the source clip's frame. To keep its length, set duration_seconds to the clip's length (4-15); -1 lets the model choose."
  doubao-seedance-2-0-fast: *seedance_2_0_edit
  doubao-seedance-2-0-mini: *seedance_2_0_edit
  wan-video: *seedance_2_0_edit
  wan-video-fast: *seedance_2_0_edit

  # Kling video edit (2026-10-22): the clip to edit rides reference_videos like any
  # reference, and `model_specific.refer_type: base` is what makes it the footage
  # edited (the adapter applies it to the video_list entry). Contract source:
  # kling-v3-omni/reference (video_list / refer_type / keep_original_sound / sound).
  kling-video-o1: &kling_edit
    video_edit:
      call_template:
        model_specific:
          refer_type: base
      requirements:
        reference_videos:
          required: true
          min_items: 1
          max_items: 1
        first_frame: {allowed: false}
        last_frame: {allowed: false}
        prompt: *seedance_edit_prompt
      notes:
        - "The output length follows the source clip; duration_seconds is not sent."
        - "Generated sound is always off with a video input (with_audio is pinned to false). To keep the source clip's own audio, add model_specific.keep_original_sound: yes."
        - "Set aspect_ratio to the source clip's ratio (16:9 / 9:16 / 1:1): adaptive is sent as 16:9."
        - "With a video input an image can only be a reference: put a replacement character or style image in reference_images, never first_frame / last_frame."
  kling-v3-omni: *kling_edit
