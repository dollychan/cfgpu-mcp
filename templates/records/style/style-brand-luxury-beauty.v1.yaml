content: |-
  适用：美妆、时尚、精品酒店、高端服务。
  画面：象牙、石色、深咖为主；衬线字标和优雅的组合字母；纸张颗粒、压印、烫印；产品标签；编辑式的局部裁切；柔和的阴影。
  Logo 方向：组合字母、印章、花瓣、器皿、仪式物件、精修的文字标。
  情绪：有品位、成熟、贵而不炫。
  避免：仿冒奢侈品纹样、金色滥用、廉价的光泽和闪粉。
