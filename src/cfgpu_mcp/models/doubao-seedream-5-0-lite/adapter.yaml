adapter_id: doubao-seedream-5-0-lite
display_name: "Doubao Seedream 5.0 lite"
cfgpu_model_id: doubao-seedream-5-0-260128
model_name: doubao-seedream-5-0-lite
task_type: image
endpoint: /images/generations
is_async: false
poll_endpoint: ~

# Canonical tasks (capabilities/media_tasks.yaml) — what this model can do, for
# both the code gates and the agent-facing profile catalog.
tasks:
  - text_to_image
  - image_to_image
  - multi_image_fusion
  - multi_image_group

# Material slots (adapters/inputs.py). Seedream 4.0 / 4.5 inherit these.
inputs:
  reference_images: {max: 14}

cost_tier: 2
speed_tier: 3

# Second choice for model="auto" behind 5.0 Pro (2): taken whenever supports()
# rules Pro out — 3K/4K, 组图 n>1, 联网搜索 — none of which Pro offers. 4.0 / 4.5
# extend this file and zero it back out, so the fallback is the newest lite rather
# than the alphabetically first name.
auto_priority: 1

# Accepted aspect_ratio values (every family's pixel tables cover these eight; Seedream's whole family inherits them). adaptive is always accepted.
aspect_ratios: ["1:1", "4:3", "3:4", "16:9", "9:16", "3:2", "2:3", "21:9"]
