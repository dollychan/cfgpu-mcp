content: A clean, vector-based flat design illustration for a modern health and wellness editorial. The scene features a diverse group of stylized people practicing yoga and meditation in a minimalist park. The characters have simplified, elegant proportions with no facial features, wearing activewear in a palette of 'Muted Sage', 'Dusty Rose', and 'Sand'. The background consists of geometric semi-circles representing hills and simple leaf shapes in varying shades of green. There are no gradients or shadows; the entire image is composed of solid, overlapping color blocks with crisp edges. The composition is balanced and airy, with plenty of negative space. The lighting is represented by a single yellow circle for the sun, casting no shadows. The overall aesthetic is friendly, professional, and very 'Behance 2024,' emphasizing clarity and calm.
