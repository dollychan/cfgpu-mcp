[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cfgpu-mcp"
version = "0.1.0"
description = "MCP Server for CFGPU image and video generation models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "dollychan", email = "dollychan0115@gmail.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "llm",
    "image-generation",
    "video-generation",
    "cfgpu",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.0",
    "aiohttp>=3.9",
    "pydantic>=2.0",
    "aiosqlite>=0.19",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7",
]
cli = [
    "click>=8.0",
]
http = [
    "uvicorn>=0.23",
]
postgres = [
    "asyncpg>=0.29",
]

[project.urls]
Homepage = "https://github.com/dollychan/cfgpu-mcp"
Repository = "https://github.com/dollychan/cfgpu-mcp"
Issues = "https://github.com/dollychan/cfgpu-mcp/issues"

[project.scripts]
cfgpu-mcp = "cfgpu_mcp.server:main"
cfgpu = "cfgpu_mcp.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/cfgpu_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true
