slots:
- name: 画幅
  required: true
- name: 背景风格
  required: true
  hint: 白色科技风 或 黑底轮廓光
- name: 产品名称
  required: true
- name: 产品主色
  required: true
- name: 叙事脊柱
  required: true
  hint: 发布型 / 功能触感型 / 色彩家族型
- name: 开场产品动作
  required: true
- name: 主视觉角度
  required: true
- name: 材质或结构细节
  required: true
- name: 中段文案
  required: true
  hint: 3–5 个英文词
- name: 前半文字颜色
  required: true
  hint: 白底用黑或深灰，黑底用白
- name: 产品自然动作
  required: true
- name: 结尾文案
  required: true
  hint: 3–5 个英文词
