content: |-
  15秒，16:9横版视频。将实拍的[实拍空间]与手绘发光动画融合的影像，手持一镜到底，按秒推进。
  实拍空间与拍摄质感：[空间细节]，手持手机拍摄，自然光，轻微晃动。
  0–3秒：[初始形态]以[中心色彩]的发光笔触出现，[与手或实物的接触方式]。
  3–6秒：它变形为[第二形态]，保留上一形态的线条痕迹，沿[追逐路线]逃开，拍摄者伸手去抓。
  6–10秒：继续变形为[第三形态]，[一次恶作剧或发现]，拍摄者[拍摄者反应]。
  10–13秒：变形为[第四形态]，钻进或绕过[空间中的物件]，镜头慢半拍追上。
  13–15秒：线条扩散到整个空间，变成[空间级变形]，以[可爱笑点]收尾。
  手绘质感：蜡笔、粉笔、彩铅般的粗糙发光笔触，线条轻微抖动，逐帧重画感。
  相机：慢半拍的手持追拍，不把动画稳定居中。
  禁止：3D CG、毛绒感、平滑霓虹、恐怖元素、巨大眼睛、牙齿、跳吓、突然黑屏、突然出现新角色。
  [[sound: [环境音]，配合接触与变形的轻微音效]]
