source:
  origin: first-party, structure adapted from MiniMax-AI/MiniMax-H3 (minimalist-product-ad-generator)
  license: first-party
  url: https://github.com/MiniMax-AI/MiniMax-H3/tree/main/skills/minimalist-product-ad-generator
content: |-
  适用：耳机、手表、数码配件、小家电、香薰、潮玩、食品等实体产品的 5–15 秒广告短片。不适合达人口播、复杂屏幕演示。
  叙事脊柱（三选一）：
  - 发布型（默认）：留白开场 → 主推款建立主视觉 → 材质/结构特写 → 产品自然动作 → 款式或色彩关系 → 文案收束。
  - 功能触感型：静置 → 触发交互 → 功能动作 → 细节放大 → 使用感受 → 收束。适合有开合、旋转、磁吸、灯光、折叠的产品。
  - 色彩家族型：主推款单独出场 → 其他颜色轻量进入 → 形成秩序 → 全套收束。适合多色多款。
  节奏：每个节拍只有一个主动作，次级元素延后出现。5 秒片 1 个小峰值 + 1 次稳定收束；10 秒片 1–2 个峰值 + 1–2 次停顿；15 秒片 2–3 个峰值 + 2 次停顿。
  转场：由产品自身驱动——边缘高光、开合、旋转、滑入、款式排列的几何变化；不用无意义闪白、随机粒子。
  产品本色是硬约束：所有画面保持原图的本体颜色、点缀色和材质；"高级感"只改背景、光线、构图，不把产品改成白色或银灰。
  开场：尽快给出有吸引力的产品动作或刁钻视角（例如从结构内部旋转露出、沿轮廓滑出），不要空白等待。
  背景：白色科技风用纯净白背景，不用镜面反光台面、玻璃台面；或黑底轮廓光。
  画面文字：
  - 英文短句，3–5 个词，单行，同一时刻只出现一条；不做上下两行、主副标题。
  - 两段配色：白底时前半黑或深灰、后半用产品主色；黑底时前半白、后半产品主色。
  - 进入方式：前半先淡入或轻滑入，后半随后进入，前半在同一行内轻微位移让位；不要完全静止，也不要弹跳霓虹。
  - 位置在画面上下居中区域，靠左或靠右成为构图的一部分，不放底部字幕位。
  - 文字容易出错时减少次数：10 秒片通常只保留一次中段文字和一次结尾文字。
  多款式：先定一个主推款，其余款式只在过渡或结尾出现；不做商品墙、九宫格、平铺。
  禁止：网格、分屏、拼贴、画框、分镜板式画面；伪科技界面；装饰性文字墙；未经确认的数据；全片同一种缓动。
  配乐方向：约 100 BPM 的科技感器乐，清脆 pluck、空气感底噪、kick 与 sub-bass 卡点、木质打击；结尾 0.5 秒内收住，只留 pluck 余音；无人声。
