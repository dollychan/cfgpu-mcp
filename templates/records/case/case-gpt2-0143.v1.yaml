content: A stylized landscape illustration composed entirely of sharp, flat-shaded geometric polygons. The subject is a range of snow-capped mountains at sunset. Every surface is a triangle or quadrilateral, with no curves or gradients. The lighting is calculated by the angle of the polygons, creating distinct facets of light and shadow. The color palette transitions from 'Deep Indigo' in the valleys to 'Fiery Crimson' and 'Gold' on the mountain peaks. In the foreground, a low-poly pine forest is represented by simple green tetrahedrons. The sky is a series of horizontal bands of color, with a low-poly sun made of concentric yellow circles. The overall look is reminiscent of early 3D video game aesthetics but with a modern, high-resolution finish. The mood is clean, digital, and strangely peaceful in its mathematical simplicity.
