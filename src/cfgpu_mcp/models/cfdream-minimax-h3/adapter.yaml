# MiniMax H3 (fl2va weights) via the co-located comfy-gateway.
# Contract: comfy-gateway/API.md. Change that document before changing either side.
#
# Directory name flattens the slash in model_name — same convention as
# minimax-speech-2-8-hd / MiniMax/speech-2.8-hd.
adapter_id: cfdream-minimax-h3
display_name: "MiniMax H3"
cfgpu_model_id: cfdream/minimax-h3      # the `model` field sent to the gateway
model_name: cfdream/minimax-h3          # the only public identifier

# Not the CFGPU API. Requires a `providers.comfy` block in config.yaml — without
# it this model is not registered at all, so it can never be offered or routed to
# (see AdapterRegistry._has_provider).
provider: comfy

task_type: video
endpoint: /video/generations
is_async: true
poll_endpoint: /video/tasks/{task_id}

capabilities:
  - text_to_video
  - image_to_video
  - first_last_frame

# All three tiers, matching comfy-gateway's OPEN_RESOLUTIONS (0.4 / 0.9 / 2.0 MP).
# Widened from ["480p"] on 2026-08-14: the narrow list was a calibration state,
# never a capability ceiling — width/height have always been computed at run time
# by the ResolutionSelector node, and all three megapixel values were already in
# the gateway's table.
#
# ★ What widening this changed, and what had to move with it:
#   - model="auto" can now land here for an ordinary 720p request. That used to be
#     prevented by the resolution list as a side effect; it is now carried by
#     speed_tier alone (see below), which is where it belongs — "one serial GPU"
#     is a speed fact, not a resolution fact.
#   - Run time scales with pixels: 480p/5s measured at ~96s, so 1080p/15s
#     extrapolates to ~20min. poll_config.default_timeout was raised to match
#     (see the bottom of this file) — otherwise the tiers that just opened would
#     mostly report a timeout the gateway never had.
# VRAM peak at 0.9/2.0 MP is still unmeasured. Exceeding it is an upstream OOM →
# `failed` with the real message, which is an honest failure; guessing a ceiling
# here would reject runs that actually fit.
resolutions: ["480p", "720p", "1080p"]
max_duration_seconds: 15

# Local weights on hardware we already pay for → cheap. ~96s of GPU for 5s of
# video at steady state (+47s on a cold model load) → slow. Both tiers feed the
# router's score, so being honest here is what keeps auto-selection sane.
cost_tier: 1
speed_tier: 1

# No payload_mapping / response_url_key: this model uses a Python adapter
# (adapters/cfdream_h3.py) so that `seed` and the real `expires_at` survive the
# response, and so lists/bools go on the wire with their own types.

poll_config:
  base_interval: 5
  max_interval: 20
  backoff_factor: 1.3
  # Raised 900 → 1500 on 2026-08-14, together with the resolutions above.
  #
  # Run time tracks pixel count: 480p/5s measured at ~96s, so 720p is ~2.25x and
  # 1080p ~5x that per second of video; 1080p at the 15s ceiling extrapolates to
  # roughly 20 minutes. At 900s the tiers that just opened would have spent a full
  # GPU run and *then* reported a timeout — the artifact exists, the caller is
  # told it does not.
  #
  # ★ Still strictly below the gateway's own per-task ceiling (1800s,
  # queue.task_timeout_seconds), and that ordering is the point, not the numbers:
  # when this side gives up first the task keeps running, lands in the gateway's
  # DB, and a later task_status returns the artifact. If the gateway's ceiling
  # ever drops, this has to drop with it.
  default_timeout: 1500
