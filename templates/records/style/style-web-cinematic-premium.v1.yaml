content: |-
  适用：用户说"电影感、氛围、高端、奢华、大胆"。
  首屏：巨型陈述式——超大字和大图占满第一屏，文字放在左下或画面下部 40% 的安全区。
  背景：全幅图加深色或色调遮罩保证文字可读；柔和径向暗角衬托产品局部；细噪点叠在渐变上增加触感。背景图的色调必须与色板一致，强调色不随背景变化。
  渐变：可以使用与色板匹配的电影感色调渐变。
  构图：图即画布，文字压在干净的安全区；区块之间用整屏影像和安静的文字区交替。
  避免：图片与色板打架、文字压在杂乱区域、霓虹光晕、每一屏都满幅导致没有呼吸。
