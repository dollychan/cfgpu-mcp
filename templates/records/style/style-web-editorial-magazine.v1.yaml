content: |-
  适用：用户说"编辑感、杂志风、艺术指导、时尚"。
  首屏：中等编辑式或巨型陈述式；主标题可以很大，配一张有强烈调色的照片。
  背景：编辑式分栏图（50/50、60/40 可左右翻转）、双色调处理的照片、单色调的氛围照片。
  渐变：只用细微的色调过渡。
  字体：优雅衬线配无衬线，大小对比强；可用竖排旁注、超大编号。
  构图：偏离网格的错位、非对称牵引、图片出血；但阅读顺序必须清楚。
  避免：所有区块同一种分栏、图片当装饰贴边、字体超过两种。
