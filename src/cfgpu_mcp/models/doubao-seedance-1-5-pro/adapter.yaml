extends: wan-2-0
card_base: ~

adapter_id: doubao-seedance-1-5-pro
display_name: "Doubao Seedance 1.5 Pro"
model_name: doubao-seedance-1-5-pro
cfgpu_model_id: doubao-seedance-1-5-pro-251215

# Material slots this model accepts — the single source for supports(), the
# profile catalog and the consistency tests (adapters/inputs.py). An absent slot
# is not accepted.
inputs:
  # No reference material at all: these slots are inherited from wan-2-0, so they
  # are removed explicitly.
  reference_images: null
  reference_videos: null
  reference_audios: null

# Canonical tasks (capabilities/media_tasks.yaml) — what this model can do, for
# both the code gates and the agent-facing profile catalog.
tasks:
  - text_to_video
  - image_to_video
  - first_last_frame
  - synced_audio_output

cost_tier: 2
speed_tier: 3

# 1.5 Pro caps explicit durations at 12s, below the 15s the rest of the family allows.
max_duration_seconds: 12

poll_config:
  default_timeout: 400
