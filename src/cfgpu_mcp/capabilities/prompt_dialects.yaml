# Prompt dialects — how each model wants a reference material named inside `prompt`.
#
# The caller never writes any of these. It writes `[[<handle>]]` (the unified notation,
# docs/template-library-and-dialect.md §4.2) next to a `*_refs` list that gives each
# handle its slot and position, and the server renders the handle into the label below
# just before build_payload (adapters/prompt_render.py). Nothing in this file is shown to
# an agent: not in a tool schema, not in list_model_profiles, not in an error (I-DL5).
#
# Only C/V-level evidence goes in (D-DL6): C = this repo's card/adapter says so,
# V = the vendor's own documentation. A model with no verified convention uses
# `natural`, which names a reference in plain words and is never refused.
#
# Fields
#   version   bump whenever the rendered text for some input changes (I-DL8); the task
#             row records `<id>@<version>`, so an old render stays explainable.
#   extends   inherit every field not set here (single level is enough today).
#   ref       label template per material kind — image / video / audio. A kind with no
#             template cannot be referenced on that model; load-time checks require the
#             template set to cover every reference slot the model's `inputs:` accepts.
#   numbering per_kind        each kind counts from 1 on its own
#             global_ordered  one count across kinds, concatenated in `order`
#   required  every passed reference must be named in the rendered prompt, or the
#             request is refused before it is sent (D-DL3). Only for models that
#             silently ignore an unnamed reference.
#
# Template fields: `{n}` — the 1-based number under this dialect's numbering rule.
#
# Structure (P2) — how the reserved markers render. A dialect without one of these cannot
# render that marker, and a request using it is refused for this model (auto routes on).
#   layout    inline | h3_fields | h3_ref2va — assemble in the caller's order, or move
#             sound/music into H3's own fields behind a mode header.
#   shot      {each} or {first, next}, fields {index} {start} {end}; time: secs | mmss_ms
#   say       {any} or {speaker, anonymous}, fields {speaker} {lang} {text}; lang: detect | omit
#   text / sound / music   one template each, field {text}
#   header    H3 mode header per frames mode (i2va / fl2va / l2va), fields {duration}
#             {last_index}; chosen from first_frame / last_frame, never written by a caller
#   rewrite   the server-side rewrite this model does (prompt_extend). D-DL10: when the
#             prompt carries [[...]] markup and the caller left prompt_extend unset, it is
#             sent as false, since a rewrite renumbers labels and retimes shots.
#   multi_shot  a request parameter that must accompany two or more shots
#             (wan26_shot_type → parameters.shot_type = multi, unless the caller set it).

schema_version: 1

dialects:
  # Whole-image ordinal, the behaviour `regions._ordinal` always had. Every image and
  # understanding model uses it today, and region rendering depends on it, so it must
  # stay byte-identical (I-DL2). generate_image takes one structure marker, [[text: …]]:
  # exact text in the picture goes in double quotes (C: Seedream Flash card; 3P: Nano
  # Banana / GPT-Image prompt guides).
  image-ordinal:
    version: 1
    ref: {image: "图{n}"}
    numbering: per_kind
    text: '"{text}"'

  # No verified numbering convention: name the reference in plain words. Never refused;
  # the model reads it as ordinary description (Q-DL2: neutral wording). Its structural
  # templates are the neutral fallback every other non-H3 dialect starts from.
  natural:
    version: 1
    ref: {image: "参考图{n}", video: "参考视频{n}", audio: "参考音频{n}"}
    numbering: per_kind
    shot: {each: "{start}–{end} 秒：", time: secs}
    say: {any: '“{text}”', lang: omit}
    text: '“{text}”'
    sound: "音效：{text}"
    music: "背景音乐：{text}"

  # Seedance 2.x and the WAN 2.0 entry that serves it. C: wan-2-0/card.md
  # 「将视频1礼盒中的香水替换成图片1中的面霜」, doubao-seedance-2-5/card.md (time-segmented
  # prompts `[0-10秒]：…`; dialogue in double quotes is voiced automatically).
  seedance:
    version: 1
    extends: natural
    ref: {image: "图片{n}", video: "视频{n}", audio: "音频{n}"}
    numbering: per_kind
    shot: {each: "[{start}-{end}秒]：", time: secs}

  # MiniMax H3 family. V: MiniMax-AI/MiniMax-H3 skills/h3-prompt-writing (base-en.txt);
  # C: cfdream-minimax-h3-r2v/card.md. With structure, the prompt becomes H3's own
  # field layout: a mode header derived from the frames, `[Shot N] At MM:SS.mmm,` cuts,
  # `(S1) says: <d>[Lang] …</d>` dialogue, and sound/music in their own fields.
  h3:
    version: 1
    ref: {image: "<Picture {n}>", video: "<Video {n}>", audio: "<Audio {n}>"}
    numbering: per_kind
    layout: h3_fields
    shot: {first: "[Shot 1] ", next: "[Shot {index}] At {start}, ", time: mmss_ms}
    say:
      speaker: "({speaker}) says: <d>[{lang}] {text}</d>"
      anonymous: "says: <d>[{lang}] {text}</d>"
      lang: detect
    text: '"{text}"'
    header:
      i2va: "For the target video, at 0.00 seconds into the target video, <Picture 1> (from [Shot 1]) is fully referenced."
      fl2va: "How the reference pictures align with the target video — Picture 1 (from Shot 1) aligns with the 0.00-second mark of the target video; Picture 2 (from Shot {last_index}) aligns with the {duration}-second mark of the target video."
      l2va: "How the reference pictures align with the target video — <Picture 1> (from [Shot {last_index}]) aligns with the {duration}-second mark of the target video."

  # The ref2va weights ignore any reference the prompt does not tag, without an error
  # (cfdream-minimax-h3-r2v/card.md) — so an untagged one is refused here instead. Its
  # full-reference layout keeps the body in `detailed_description` (V: ref-en.txt);
  # the analysis sections (subject_definitions, retention_analysis) are content, not
  # notation, and are not generated (Q-DL5).
  h3-ref2va:
    version: 1
    extends: h3
    required: true
    layout: h3_ref2va
    header: {}

  # 万相 multi-shot prompts: 「第N个镜头[a-b秒] …」. C: wan-2-7-t2v / wan-2-6-t2v card
  # examples. 2.6 renders multiple shots only with `shot_type: multi` *and* the server
  # rewrite on (百炼 API reference), so this dialect keeps the rewrite and sets the
  # parameter; references are named in plain words (no verified numbering).
  wan-multishot:
    version: 1
    extends: natural
    shot: {each: "第{index}个镜头[{start}-{end}秒] ", time: secs}
    multi_shot: wan26_shot_type

  # 万相 2.7: same shot form, no shot_type parameter, and the server rewrite is turned
  # off when the prompt carries markup (D-DL10).
  wan27:
    version: 1
    extends: natural
    shot: {each: "第{index}个镜头[{start}-{end}秒] ", time: secs}
    rewrite: prompt_extend

  # 万相 2.7 r2v numbers videos first, then images, in one sequence (C: wan-2-7-r2v
  # card + wan_video.py media order): two videos and one image are 视频1 视频2 图片3.
  wan27-r2v:
    version: 1
    extends: wan27
    ref: {video: "视频{n}", image: "图片{n}"}
    numbering: global_ordered
    order: [video, image]

  # 万相 2.6 r2v names each reference subject characterN, videos then images, matching
  # the order the adapter builds its reference_urls list in (C: wan-2-6-r2v card; V:
  # 百炼 wan2.6-r2v API reference). Multi-shot like the rest of 2.6.
  wan26-r2v:
    version: 1
    extends: wan-multishot
    ref: {video: "character{n}", image: "character{n}"}
    numbering: global_ordered
    order: [video, image]

  # HappyHorse r2v. C: happyhorse-1-0-r2v/card.md「[Image N] 引用第 N 张参考图」.
  happyhorse-r2v:
    version: 1
    extends: natural
    ref: {image: "[Image {n}]"}
    numbering: per_kind
