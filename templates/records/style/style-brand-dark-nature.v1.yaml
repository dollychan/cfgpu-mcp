content: |-
  适用：策略咨询、出行、健康、气候、安静的高端软件服务。
  画面：深绿底，青柠作唯一强调色；雾气中的山野风景；圆形图像遮罩；柔和的半透明叠层；安静的页码标签和深色编辑式网格。
  Logo 方向：路径、叶、月、地平线、指南针、门洞、折叠标。
  情绪：平静、可信、专注。
  避免：鲜艳的自然色堆砌、卡通植物、与品牌含义无关的风景。
