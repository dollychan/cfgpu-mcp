content: |-
  约30秒，[画幅]，暗色 SaaS 魔术 UI 风格的[产品名称]介绍片。黑色空间舞台，底部弱紫色地平线光，大号白色无衬线动态字，青到品红的渐变按钮。
  [[shot 0-5.5]] 动态承诺——黑场中逐字打出 [[text: [承诺句]]]，关键名词横向拖影替换为 [[text: [替换名词]]]，速度擦除进入下一场。
  [[shot 5.5-9.5]] 提示词召唤——倾斜的大提示词卡片，打出 [[text: [示例提示词]]]，渐变按钮 [[text: [按钮文字]]] 发光，光标点击触发闪光换场。
  [[shot 9.5-14.5]] 生成结果——多张[产出类型]卡片在黑色空间视差漂浮，一张主卡横穿画面，最后汇成一块完整画布。
  [[shot 14.5-17]] 平台能力——应用窗口从底部升起，上方打出 [[text: [平台能力句]]]，下方出现平台胶囊。
  [[shot 17-20.5]] 连接生态——大圆形节点沿弧线进入，四周依次出现[集成服务]文字胶囊。
  [[shot 20.5-24.5]] 能力环——一圈[模型或能力]徽章环绕旋转，读清后中央出现短句。
  [[shot 24.5-30]] 导出迸发与主张——点击导出按钮，文件夹中迸出[导出格式]胶囊；随后单词逐步扩展为 [[text: [最终主张]]] 并停留至少1秒。
  不要：整屏纯色闪烁、持续横向霓虹线、远处的小界面、平铺网页布局、伪造的官方 LOGO。
