content: |-
  在[原视频]的基础上编辑，5 秒：原视频的人物样貌、构图、黄昏暖光、草坡和背景里的白色小羊全部保留，只让画面中央穿粉色西装、抱着小黑羊的金发年轻男人开口说话。原视频的背景音乐保留，压在台词下面持续播放；他的音色参考[音色参考音频]，平静温和。
  写实摄影风格，镜头缓慢推近。他望向前方，轻声说 [[say S1: Follow the wind, live free.]] 说话时重心微微移动，稳稳抱着怀里的小黑羊。接着说 [[say S1: Leave worries behind, enjoy the moment.]] 话音一落，嘴唇合上，露出放松的微笑，下巴不再动；随后他把目光转向远处的地平线，手指轻抚小黑羊的毛，镜头停在这个画面直到结束。
  [[sound: 原视频的背景音乐持续铺底，上面是他平静清晰的男声台词]]
