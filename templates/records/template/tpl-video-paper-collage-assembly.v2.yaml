content: |-
  纸拼贴定格组装动画，约4秒，[画幅]。最终画面以[最终静帧]为准。
  从与最终静帧主背景一致的干净[主色]纸色场开始；按可读顺序组装前景、中景、背景纸片组：先是[基础结构]，再是[主要隐喻元素]，最后是[次要物件]。每个纸片出现、滑入或弹入、轻微回弹、压平、停顿、锁定到位。
  保留半调网点、暖白描边、细微纤维撕边、层叠纸缝、柔和阴影和纸纹。结尾停留在与最终静帧一致的完整构图上。
  [[sound: 只有与纸片动作同步的触感拼贴音效：纸片滑动、弹入、压平轻敲、轻微摩擦、小纸片脆响]]；不加背景音乐、旁白或对白。
  不要：牛皮纸开场、发黄或偏棕的底、快速旋转、混乱飞散、平滑数字图层移动、切镜、运镜、变焦、形变、新增物件、文字、LOGO、水印、界面。
