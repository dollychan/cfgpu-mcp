  url: https://github.com/Pluviobyte/video-production-skills/tree/main/black-white-text-opener
content: |-
  适用：教程、产品、评论、课程视频前的 2.4–7.5 秒开场；适合 HTML/代码合成，也可作为视频生成的描述。
  视觉：纯黑或近黑背景（#000000–#050505），白或近白文字（#ffffff–#f4f4f5）；只在整体是电影感暗色风格时加极轻微的颗粒或星点；不用彩色背景、重渐变、横向霓虹线或整屏彩色闪烁。
  字体：干净的无衬线体，一行强句或两行短句，主句字高约为画面高度的 9–15%，字距正常或略宽，手机上也要清楚。
  运动：从空行开始逐字打出整句，只给新出现的字加极轻的透明度或模糊软化；替换时先清掉或横向抹掉上一句，再逐字打出下一句，不整句淡入；替换不超过 3 次。
  时长档：
  - 短（2.4–3.2 秒）：0–0.2 纯黑；0.2–0.95 主句打出；0.95–1.7 停留或一次替换；1.7–2.5 最终句停留；2.5–3.2 抹出、擦除或切入正片。
  - 标准（4.8–5.8 秒，默认）：0–0.3 纯黑；0.3–1.35 第一句打出；1.2–2.2 停留；2.2–3.55 一到两次替换；3.55–4.7 最终句打出并停留；4.7–5.8 转场。
  - 慢（6.0–7.5 秒）：留更长的黑场与呼吸，替换时加横向模糊，结尾白色擦除或淡出。
  打字速度：默认每秒 14 字；中文密集时 12 字；英文短词或产品名 14–16 字；放不下就删字，不要超过每秒 16 字。
  声音：短而干的按键声，不用提示音；音量低（单独开场时峰值约 -18 到 -12 dB），轻微变化音高与音量；第一个字出现时开始，停留与转场时不响；空格、换行、纯标点停顿不配声；有背景音乐时把键盘声压在下面。
  转出：白色速度擦除、文字抹入黑暗、淡出到黑或停留后硬切。
