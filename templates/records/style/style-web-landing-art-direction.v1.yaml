content: |-
  适用：落地页、营销页、作品集的分区设计稿，以及照着设计稿写页面。不适合后台、仪表盘、数据表格。
  出图：每个区块单独一张横版图，不把多个区块压进一张长图；所有图同一画幅、同一套色板，像同一个网站。
  每张图要让开发者看得出：版式、层级、间距、字号阶梯、按钮主次、组件样式、图片处理。不要画成抽象氛围图。
  首屏：一句 5–10 个词的有力主标题、简短副标题、一个主按钮，大量留白；不堆徽章、假数据、小 Logo 墙。左文右图是最常见的套路，不作为默认——可选居中陈述压在全幅图下部、左下或右下压图、图即画布、反向分栏、极简小首屏（小 Logo、一句话、细按钮）。
  构图：各区块的锚点要变化，全站至少三种；背景方式也要变化：纯色加小图、纸张或网格纹理、全幅图加色调遮罩、编辑式分栏图、色块对拼、低饱和色调渐变。
  主线：全站选一条叙事母题贯穿（珍藏品、旅程、精密工具、生长系统、舞台聚光、档案卷宗），再选一个只出现一次的"第二眼"细节（一个超大数字、一处材质切换、一条竖排旁注）。
  色板：一个主色、一个辅色、一个只用于按钮和高亮的强调色，加一组中性色；各区块换情绪也不换色板。渐变只用低饱和、与色板一致的色调渐变。
  文字：主标题用中等或细字重、紧字距、行数受控；不用渐变字冒充高级感。文案短、可信，不用"赋能、颠覆、无缝、下一代"这类空话，不编造品牌名。
  避免：一路居中到底、每个区块一排三张相同卡片、蓝紫 AI 渐变、满屏发光边、漂浮球体、无理由的毛玻璃叠层、读不清的合作方 Logo 跑马灯、三列假统计数字。
