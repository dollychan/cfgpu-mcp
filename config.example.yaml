# cfgpu-mcp configuration template.
#
# Copy to `config.yaml` and edit. The runtime `config.yaml` is gitignored.
# The ONLY secret is CFGPU_API_TOKEN — keep it in the environment, not here.
#
# Precedence: environment override > config.yaml > built-in defaults.
# Point at this file with the CFGPU_CONFIG env var, or place config.yaml in CWD.
#
# A gitignored `.env` in CWD (or CFGPU_DOTENV path) is auto-loaded at startup,
# so secrets like CFGPU_API_TOKEN or the DB URL behind `$DATABASE_URL` below can
# live there instead of being exported by hand. Real env vars still take priority.

transport: stdio              # stdio | streamable-http

http:                          # only used when transport=streamable-http
  host: 0.0.0.0
  port: 8080
  stateless: true              # MUST stay true for multi-tenant per-request tokens;
                               # false freezes one caller's token into the session
                               # (cross-tenant leak) and the server refuses to start.

cfgpu_api:
  base_url: https://www.cfgpu.com/userapi/v1
  http_timeout: 120            # per-request total timeout (seconds)
  connect_timeout: 10

task_db:
  url: sqlite:///~/.cfgpu/tasks.db
  # url: postgresql://user:pass@host:5432/cfgpu   # multi-instance horizontal scaling
  # url: $DATABASE_URL                            # or $VAR / ${VAR} → read from environment
  pool_min: 1                  # Postgres connection pool (ignored by SQLite)
  pool_max: 10

enabled_models:                # whitelist override; omit / null = load all models
  # - wan-2-0-fast
  # - doubao-seedream-5-0-lite
