id: tpl-video-product-ad-15s
version: 1
rank: 210
kind: template
media: video
title: 产品广告片 15 秒：旋转入场 → 多角度 → 场景 → 定格
summary: 15 秒产品展示视频的四段式时间轴骨架，可选参考一段已有广告的剪辑节奏。
genres:
- product-ad
scenes:
- commerce
styles:
- product
tags:
- 电商
- 15秒
- 分时段
slots:
- name: 产品名称
  required: true
- name: 产品参考图
  required: true
  hint: 该素材在 prompt 中的引用；只写调用方约定的素材写法，不写任何模型专用标签
- name: 风格参考视频
  required: false
  hint: 该素材在 prompt 中的引用；只写调用方约定的素材写法，不写任何模型专用标签；没有可整句删除
- name: 标志性细节
  required: true
- name: 使用场景
  required: true
- name: 广告语
  required: true
- name: 背景音乐风格
  required: true
source:
  origin: dexhunter/seedance2-skill
  license: MIT
  author: Dex
  url: https://github.com/dexhunter/seedance2-skill/blob/main/zh/SKILL.md
content: |-
  制作一段15秒的[产品名称]展示视频，产品外观以[产品参考图]为准。
  剪辑节奏与转场方式参考[风格参考视频]。
  0–3秒：产品以动感旋转入场，特写表面材质和[标志性细节]。
  4–8秒：多角度转场展示正面、侧面、背面，配合扫光效果。
  9–12秒：产品在[使用场景]中展示实际用法。
  13–15秒：产品主视觉定格，画面文字「[广告语]」出现，背景音乐推向高潮。
  声音：[背景音乐风格]，加入产品交互音效。
