content: |-
  适用：任意文生视频、图生视频、参考生视频的提示词撰写与自查。
  结构：主体或人物设定 → 场景与环境 → 动作与运动 → 运镜 → 分时段描述 → 转场与特效 → 声音设计 → 风格与氛围。
  分时段：10 秒以上按时间段写，例如「0–3秒：开场画面、运镜、动作」「3–6秒：中段发展」「6–10秒：高潮或关键动作」「10–15秒：收尾、定格、品牌文字」。
  参考素材：每个参考素材都要写明用途——首帧、尾帧、人物形象、场景、运镜、动作编排、特效与转场、节奏、旁白音色、背景音乐、服装、产品外观、字体。只写"参考某视频"不够，要写参考它的什么。
  基础运镜：推镜头/慢推、拉镜头/后拉、左右摇、上下摇、跟拍、环绕、一镜到底。
  进阶运镜：希区柯克变焦（推拉与变焦反向，制造眩晕）、鱼眼、低角度仰拍（英雄感）、俯拍/鸟瞰、第一人称主观视角、快速摇镜（运动模糊）、机械臂式多角度跟随。
  景别：极致特写、面部特写、中近景、中景、全景、远景/建立镜头。
  画面修饰：电影级质感、胶片颗粒、浅景深；2.35:1 宽银幕、24fps；黑白水墨、动漫、超写实；高饱和霓虹、冷暖对比；超精细 CG。
  氛围：紧张悬疑、温暖治愈、史诗恢宏、喜剧夸张、纪录片式克制、暗黑奇幻、仙侠高燃。
  声音：写背景音乐情绪、环境音效（脚步、人群、车流）、转场与音乐节奏卡点、拟音与节拍贴合。
  避坑：
  - 参考用途含糊。
  - 同一段同时要求"固定镜头"和"环绕镜头"这类冲突指令。
  - 4–5 秒里塞入过多场景，超出物理可行。
  - 传了多个参考素材，却没有逐个说明用途。
  - 不写声音设计。
  - 提示词复杂度与生成时长不匹配。
  - 使用可清晰辨认的真人面部素材（多数视频模型会拦截）。
