content: '[人物参考图]中的男人下班后疲惫地走在走廊，脚步变缓，最后停在家门口；脸部特写，他深呼吸调整情绪，收起负面情绪，变得轻松；特写他翻找出钥匙插入门锁；进门后他的小女儿和一只宠物狗欢快地跑过来迎接拥抱，室内非常温馨，全程自然对话。'
