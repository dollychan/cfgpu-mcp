content: |-
  将[待延长视频]向后延长15秒。
  1–5秒：光影透过百叶窗在木桌、杯身上缓缓滑过，树枝伴随轻微呼吸般的晃动。
  6–10秒：一粒咖啡豆从画面上方轻轻飘落，镜头向咖啡豆推进直至黑屏。
  11–15秒：英文逐行渐显，第一行「Lucky Coffee」，第二行「Breakfast」，第三行「AM 7:00-10:00」。
  注意：生成时长选新增部分的时长（本例为 15 秒）。
