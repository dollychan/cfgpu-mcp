content: |-
  适用：AI 工具、SaaS 产品的 8–60 秒介绍短片（风格层面，不是逐帧复刻某条参考视频）。
  色彩：近黑背景（不是蓝灰），低透明度灰白颗粒星点，画面底部深紫色地平线微光；前景字白色，次要文字灰色；行动渐变青 → 电光蓝 → 品红；面板为炭灰带细灰边。避免米色、暖橙、大面积紫蓝渐变背景和持续的横向霓虹线。
  字体：大号、自信的无衬线展示字；开场和结尾的主字非常大；界面标签小而清晰；按钮中等字重、圆角、发光。
  英雄画面（每个场景都要有一个可读的最大时刻）：一张大提示词卡片配右下角渐变按钮；屏幕中央一个大渐变按钮；模板卡片围绕一张主卡漂浮；底部被裁切的大应用窗口；一个大圆形节点四周排着服务商标签；一圈模型徽章围着中央短句；文件夹里迸出导出格式胶囊。不要把界面缩成远处的小道具，不要做成平铺网页。
  运动：文字以打字或半打出状态进入，关键名词横向拖影后定住；点击按钮触发闪光、光晕脉冲和换场；卡片带视差漂移，其中一张成为主角；徽章沿弧线或环形运动；导出胶囊从容器弹出再漂开；大转场用速度模糊、白色速度擦除或缩放冲刺。不要无缘由的整屏纯色闪烁。
  场景模块（按产品真实能力挑选）：动态承诺句 → 提示词召唤 → 生成结果场 → 本地/平台能力 → 连接生态 → 模型/能力环 → 导出迸发 → 最终主张（一个词逐步变成完整品类句并停留至少 1 秒）。
  真实性：不悄悄编造能力；不确定的写泛化表述（如"在你工作的地方运行"而不是"本地运行"）；没有官方标识时用文字胶囊，不画假 LOGO。
