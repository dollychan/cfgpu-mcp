adapter_id: wan-2-0
display_name: "WAN 2.0"
cfgpu_model_id: wan-video
model_name: wan-video

task_type: video
endpoint: /video/generations
is_async: true
poll_endpoint: /video/tasks/{task_id}

# Material slots this model accepts — the single source for supports(), the
# profile catalog and the consistency tests (adapters/inputs.py). An absent slot
# is not accepted.
inputs:
  first_frame: {}
  last_frame: {}
  reference_images: {max: 9}
  reference_videos: {max: 3, role: reference}   # content role=reference_video; the prompt may make it the clip to edit or extend
  # The prompt says what the audio is for (card example: background music); it is
  # not a driving track. Must ride with at least one reference image or video.
  reference_audios: {max: 3, role: reference, standalone: false}

# How [[handle]] references in `prompt` are rendered for this model (capabilities/prompt_dialects.yaml); inherited by the Seedance 2.x entries that extend this one.
prompt_dialect: seedance

# Card 「Prompt 最大长度：500 汉字 / 1000 英文词」. Checked on the rendered prompt when the
# caller used [[...]] markup (ModelAdapter.prompt_limits); inherited by the Seedance
# entries that extend this one, except where they say otherwise.
prompt_limits: {zh_chars: 500, en_words: 1000}

# Canonical tasks (capabilities/media_tasks.yaml) — what this model can do, for
# both the code gates and the agent-facing profile catalog.
tasks:
  - text_to_video
  - image_to_video
  - first_last_frame
  - reference_to_video
  - video_edit
  - video_extend
  - synced_audio_output

# Whether the output has sound (adapters/inputs.py AUDIO_OUTPUTS): generate_audio ← with_audio (the whole Seedance family inherits this).
outputs:
  audio: switchable

cost_tier: 3
speed_tier: 2
resolutions: [480p, 720p, 1080p]

poll_config:
  base_interval: 5
  max_interval: 20
  backoff_factor: 1.3
  default_timeout: 3000

# The card's ratio table (inherited by every Seedance model extending this one).
# Declared once 4:5 / 5:4 / 9:21 joined the schema for HappyHorse: undeclared would
# mean "every schema ratio", and those three would reach upstream and be rejected.
aspect_ratios: ["16:9", "9:16", "1:1", "4:3", "3:4", "21:9"]
