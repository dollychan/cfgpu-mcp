schema_version: 1

# Closed language vocabulary for voices.yaml. Codes are BCP 47-style; Chinese dialects
# use a `zh-<name>` subtag of our own. A caller's `language` argument resolves to a code
# through `name` / `aliases` (case-insensitive), so "English", "英文" and "英语" all reach
# `en` — provider cards spell these differently (MiniMax 英文, seed-tts 美式英语) and a
# substring match over their spellings is what made `language="English"` return nothing.
#
# Matching is by subtag prefix: `en` matches `en-US`, `zh` matches `zh-sichuan`.
# Cantonese is `yue`, not `zh-*`, so a 中文 request does not return Cantonese voices.
# Every alias must be unique across all codes; the loader rejects collisions.
# Quote a code YAML would read as a boolean (`"no"` is Norwegian, not false).
languages:
  zh:
    name: 中文（普通话）
    aliases: [中文, 汉语, 普通话, 国语, Chinese, Mandarin]
  zh-sichuan:
    name: 四川话
    aliases: [四川话]
  zh-shaanxi:
    name: 陕西话
    aliases: [陕西话]
  zh-northeast:
    name: 东北话
    aliases: [东北话]
  yue:
    name: 粤语
    aliases: [广东话, 白话, Cantonese]
  en:
    name: 英语
    aliases: [英文, English]
  en-US:
    name: 美式英语
    aliases: [美音, American English]
  en-GB:
    name: 英式英语
    aliases: [英音, British English]
  en-AU:
    name: 澳洲英语
    aliases: [Australian English]
  en-IN:
    name: 印度英语
    aliases: [Indian English]
  ja:
    name: 日语
    aliases: [日文, Japanese]
  ko:
    name: 韩语
    aliases: [韩文, 朝鲜语, Korean]
  es:
    name: 西班牙语
    aliases: [西班牙文, Spanish]
