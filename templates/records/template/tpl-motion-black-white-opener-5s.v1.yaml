content: |-
  约5.5秒开场，[画幅]，纯黑背景，大号白色无衬线字，逐字打出并配轻微按键声。
  0–0.3秒：纯黑。
  0.3–1.35秒：逐字打出「[第一句]」。
  1.35–2.2秒：停留。
  2.2–3.55秒：把「[被替换的词]」横向抹掉，逐字打出「[替换词]」。
  3.55–4.7秒：逐字打出最终句「[最终句]」并停留可读。
  4.7–5.5秒：[转场方式]进入正片。
  按键声只在字出现时响，停留和转场时静音；不出现彩色闪烁或霓虹线。
