content: Create a photorealistic CGI caricature of the person in the uploaded image, using the uploaded image as the sole and complete visual source for clothing, accessories, pose, colors, and overall appearance. Preserve the person’s exact identity, facial features, age cues, skin tone, hair, beard, and likeness, while transforming them into a realistic caricature with a slightly oversized head, compact body, and subtly shortened proportions. The result must look like a real human recreated as high-end photoreal CGI, not a toy, not Pixar, not vinyl, not cartoon. Use realistic skin shading with natural pores and wrinkles, authentic hair and beard detail, and true-to-life materials and shadows. Lighting should be clean daylight or studio daylight with crisp, realistic shadows on a clean off-white background. No reinterpretation, no redesign, no added styling beyond what exists in the uploaded image. Ultra-high definition, hyper-realistic CGI quality, grounded and believable, no text, no logos, no watermarks. Aspect ratio 4:5.
