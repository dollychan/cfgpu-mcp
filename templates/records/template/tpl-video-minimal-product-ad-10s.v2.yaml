content: |-
  [画幅]，10秒，[背景风格]的极简产品广告片。产品为[产品名称]，本体颜色严格保持[产品主色]，不重新上色。叙事：[叙事脊柱]。
  [[shot 0-1.5]] [开场产品动作]，干净留白，无文字。
  [[shot 1.5-4]] 主视角建立，[主视觉角度]，产品边缘高光滑过。
  [[shot 4-6]] 材质与功能特写，[材质或结构细节]；画面内出现单行英文 [[text: [中段文案]]]，前半[前半文字颜色]、后半[产品主色]，前半先淡入，后半随后轻滑入，前半在同一行内轻微让位。
  [[shot 6-8]] [产品自然动作]，动作完成后制动停顿。
  [[shot 8-10]] 单一全画幅产品收束，单行英文 [[text: [结尾文案]]] 稳定停留、清晰可读，位于画面上下居中区域靠[文字位置]。
  全程同一时刻只有一条单行文字；不出现网格、分屏、拼贴或商品墙；不用镜面反光台面。
  [[music: [配乐方向]]]，节拍与产品动作和文字出现对齐。
