content: |-
  适用：新品牌的视觉方向提案、Logo 系统展示、品牌 VI 概览板。不适合单张 Logo 或海报。
  先回答五个问题再出图：品牌代表什么；核心隐喻是什么；Logo 怎么表达它；体系怎么延展到界面、印刷、图像和细节；为什么整体只属于这个品牌。
  Logo 构思最多组合两种方法：
  - 首字母加含义：用切口、折叠、负形把首字母和隐喻合成一个标，不做只有字母的图标。
  - 产品动作：把产品最核心的动作抽象成符号（构建→框架/脚手架，保护→边界/盾，转换→切换/箭头，说话→声波）。
  - 隐喻融合：两个有意义的概念合成一个简化的标，融合要含蓄但能读懂。
  - 负形：用空白藏出箭头、受保护的中心、内部路径。
  - 构成几何：圆、对角切、模块、轨道、十字准线，用一格展示构成逻辑。
  版面：深色或浅色的展示底，格子之间间距统一、对齐严格、大量留白。各格不要一样响：安静的封面格、功能性的界面格、情绪化的图像格、技术性的构成格、实物应用格、安静的口号格，形成起伏。
  配色：一个主色板——底色、主强调色、次强调色、中性色；强调色在各格重复出现，一个强调色就能撑起整套系统。
  文字：只有品牌名、一句口号、少量分区标签和极短的界面标签；不要段落、假小字、菜单、占位文字。
  细节：小页码、细线、对位标、构成线、低透明度纹理、网点处理，点到为止，让人凑近看才发现。
  避免：漂浮图标、通用渐变、过度设计的 Logo、无意义色块、拼贴式乱排、各格 Logo 不一致、颜色过多、廉价霓虹、模板感品牌板。
