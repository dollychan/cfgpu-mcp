extends: gpt-image-2
card_base: ~
adapter_id: nano-banana-2
display_name: "CF 2"
cfgpu_model_id: nano2
model_name: cf2
cost_tier: 4
speed_tier: 3

# Not a "best" pick; zeroed rather than inherited from gpt-image-2 (3).
quality_rank: 0

# Zeroed rather than inherited from gpt-image-2 ([balanced]), and it covers the
# whole subtree: -pro extends this file, -pro-official / -pro-premium extend -pro,
# so all four would otherwise declare themselves the balanced default. Nothing
# would have failed loudly — five declared defaults just fall through to the score,
# which is the accidental ordering `default_for` exists to replace.
default_for: []

# Zeroed rather than inherited from gpt-image-2 (10). `max_images_per_request` means
# "this model honours n up to here", and NanoBananaAdapter never sends `n` — it returns
# one image whatever n says. Inherited, it made the router prefer this whole subtree
# for n>1 requests it then silently served with a single image.
max_images_per_request: ~
