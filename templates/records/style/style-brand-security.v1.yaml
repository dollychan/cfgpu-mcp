content: |-
  适用：网络安全、监控、威胁情报、网络产品。
  画面：黑或藏青底；盾的形态、雷达扫描线、威胁标签、细微的运动轨迹；红蓝警示标签点缀；受控的渐变。
  Logo 方向：盾、猛禽、眼、守望、边界、受保护的核心。
  情绪：严肃、警觉、精确。
  避免：骷髅、黑客兜帽人、绿色代码雨、恐吓式视觉。
