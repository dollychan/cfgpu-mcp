content: 谍战片风格，[首帧图]作为首帧画面。镜头正面跟拍穿红风衣的女特工向前走，全景跟随，不断有路人遮挡红衣女子；走到拐角处（拐角建筑参考[拐角建筑图]），固定镜头，红衣女子走出画面、在拐角处消失；一个戴面具的女孩在拐角处躲着恶狠狠地盯着她（形象参考[面具女孩图]）；镜头往前摇向红衣女特工，她走进一座豪宅消失不见（豪宅参考[豪宅图]）。全程不要切镜头，一镜到底。
