# MiniMax H3 through the CFGPU video API.
#
# Replaces the former `submodel-minimax-h3`, which reached the same MiniMax V2
# API through a third-party host (h3.submodel.ai). The request/response contract
# is MiniMax's own and did not change; what moved is the upstream that serves it.
adapter_id: cfgpu-minimax-h3
display_name: "MiniMax H3"
cfgpu_model_id: MiniMax-H3
model_name: MiniMax-H3

# The built-in CFGPU provider, synthesized from the top-level `cfgpu_api` block
# in config.yaml. It is the only provider that reads the caller's per-request
# Authorization header (CFGPUClient.use_request_token) — every other provider
# authenticates from its own `token_env`, so multi-tenant callers each pay with
# their own credential here.
#
# (Was `cfgpu-daily` during the test phase. The endpoints below were already the
# unified CFGPU video routes, so that placement was the only thing to migrate.)
provider: cfgpu

task_type: video
# The unified CFGPU video routes, same as every other cfgpu video model — not
# MiniMax's native /v2/video_generation. CFGPU's task layer is shared across
# upstreams; the per-model shape lives in the payload, not the path.
endpoint: /video/generations
is_async: true
poll_endpoint: /video/tasks/{task_id}

capabilities:
  - text_to_video
  - image_to_video
  - first_last_frame
  - multi_modal_reference
  # The upstream always includes a native audio track.  This describes output
  # capability only: unlike models with a sound switch, audio cannot be off.
  - audio_generate

# 480P, 768P and 2K are what this API actually produces, and they are members of the
# unified enum in their own right — the adapter only upper-cases them. The latter two used to
# be reached by declaring 720p/1080p and translating in build_payload, which meant a
# caller asking for 720p was silently billed for 768P and a caller asking for the two
# real tiers had no way to spell them. 480p is now also a native MiniMax-H3 tier;
# all three values are passed without tier translation.
#
# `default_resolution` is load-bearing, not cosmetic: `resolution` is checked by
# supports(), so without it the schema's own omitted-value handling would have to pick
# a fleet-wide tier this model does not offer, and MiniMax-H3 would be filtered out of
# every call that did not name one of its tiers explicitly — including the plainest one,
# generate_video(prompt=...), which is exactly what `default_for: [balanced]` below
# exists to catch.
resolutions: [480p, 768p, 2k]
default_resolution: 768p
max_duration_seconds: 15

# ── Routing: the declared balanced default for video ─────────────────────────
#
# cost_tier 1 (was 3, inherited from the submodel-hosted config; briefly 2) is a
# *correction*, not a thumb on the scale. Against the by-the-second cohort with
# no video input, at each model's own default tier:
#   MiniMax-H3 0.1 元/秒 (480P; 0.2 at the default 768P, 0.5 at 2K) ·
#   cf-imagine-video 0.275/0.385
#   (cost 2) · wan2.7-t2v 0.63 (cost 3) · kling-video-o1 0.63 (cost 4) ·
#   happyhorse-1.0-t2v 0.945
# 0.2 at the default tier is still the cheapest per-second figure in the fleet,
# so both 3 and the 2 that replaced it understated it. (The Seedance
# family bills per token and cannot be lined up here without a tokens-per-second
# figure; none of this claims H3 is cheaper than doubao-seedance-2-0-mini, which
# also declares cost 1.)
#
# The tier is based on the current per-second output prices; input video and
# images are billed separately by the selected resolution tier.
#
# speed_tier 3 is the neutral, unmeasured value. It briefly read 4, purely to
# lift this model into the top of the balanced band; that is exactly the input
# corruption `default_for` exists to avoid, and it was wrong on its own terms —
# a model we do *not* want serving `quality_tier="fast"` is not a model whose
# speed tops the field. Replace it when real latency numbers exist.
cost_tier: 1
speed_tier: 3

# ★ The decision, kept out of the estimate above.
#
# `auto_priority` could not carry this either, and the corrected cost_tier does
# not rescue it. At speed 3 / cost 1 the balanced score is 2 — a *tie* with
# doubao-seedance-2-0-fast, cf-imagine-video and wan-video-fast, not a win — and
# the tie then breaks on `auto_priority`, where doubao-seedance-2-0-fast already
# declares 2. So the heuristic still does not land here on its own; the routing
# decision stays written as a routing decision (router.selection_key's first
# key). Verified 2026-09-07: flipping cost_tier between 1 and 2 changes no
# routing outcome across fast/balanced/best × t2v/i2v/r2v/480p/720p/2k/20s, which is
# the point — the tier is a price declaration, not the mechanism.
#
# Scoped to `balanced` alone, deliberately: `fast` stays with
# doubao-seedance-2-0-fast (score 6, genuinely the faster model) and `best` stays
# with doubao-seedance-2-5 (quality_rank, 39 vs 6). Not a pin either — 720p/1080p
# or a duration past 15s removes this model in supports(), and the runner-up
# (doubao-seedance-2-0-fast, auto_priority 2) takes over.
default_for: [balanced]

poll_config:
  base_interval: 5
  max_interval: 20
  backoff_factor: 1.3
  default_timeout: 900
