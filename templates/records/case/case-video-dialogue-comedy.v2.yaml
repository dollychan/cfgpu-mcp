content: |-
  在「猫狗吐槽间」里的一段吐槽对话，要求情感丰沛，符合脱口秀表演：
  喵酱（猫主持，舔毛翻眼）说 [[say S1: 家人们谁懂啊，我身边这位，每天除了摇尾巴、拆沙发，就只会用那种‘我超乖求摸摸’的眼神骗人类零食……]]
  旺仔（狗主持，歪头晃尾巴）说 [[say S2: 你还好意思说我？你每天睡18个小时，醒了就蹭人类腿要罐头……]]
