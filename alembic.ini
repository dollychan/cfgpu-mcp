# Manual entry point for the task-store migrations.
#
# The server applies them itself at connect time (see cfgpu_mcp/client/migrations.py),
# so this file is for the operator: inspecting history, generating a new revision, or
# running a large migration deliberately rather than on the next restart.
#
#   DATABASE_URL=postgresql+asyncpg://... alembic upgrade head
#   alembic history
#   alembic revision -m "add a column"
#
# Note the driver in the URL: the migration environment is async and uses the drivers
# this project already depends on — postgresql+asyncpg / sqlite+aiosqlite.
[alembic]
script_location = src/cfgpu_mcp/migrations
prepend_sys_path = src
# Left empty on purpose: env.py reads $DATABASE_URL and translates it to the async
# driver, so the same DSN the server uses works here unedited. Set this only to
# point a one-off run at a database the environment does not name.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
