content: |-
  改剧情：颠覆[源视频]里的剧情，男人眼神从温柔瞬间转为冰冷狠厉，在女主毫无防备时猛地把她从桥上推进水里；动作干脆利落，没有丝毫犹豫；女主坠水瞬间没有尖叫，只有难以置信的眼神，她抬头冲他嘶吼 [[say S1: 你从一开始就在骗我！]]
  换角色：把[源视频]中的女主唱换成[人物参考图]中的男主唱，动作完全模仿原视频，不要切镜，乐队演唱音乐。
  加元素：把[源视频]中女人的发型改成红色长发，[元素参考图]中的大白鲨在她身后缓缓浮出半个脑袋。
