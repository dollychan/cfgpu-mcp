adapter_id: qwen-3-6-plus
display_name: "Qwen3.6-Plus"
cfgpu_model_id: qwen3.6-plus
model_name: qwen3.6-plus

task_type: understand
endpoint: /model/v1/chat/completions
is_async: false

# region_understanding is a separate task from region_edit on purpose: being able to *read* a
# marked region does not imply being able to edit by it, and one task covering
# both would let a reader be routed an editing job.
# Canonical tasks (capabilities/media_tasks.yaml) — what this model can do, for
# both the code gates and the agent-facing profile catalog.
tasks:
  - image_understanding
  - image_reasoning
  - video_understanding
  - long_video_understanding
  - long_document_understanding
  - region_understanding
  - tool_calling
  - visual_agent
  - long_context

# No documented ceiling. This is what makes reading the escape hatch for editors that do
# have one: five regions can be understood in a single call and then edited across
# however many calls the editing model's own limit requires.
max_regions_per_image: ~

cost_tier: 2
speed_tier: 4
