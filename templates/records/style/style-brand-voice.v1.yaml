content: |-
  适用：语音 AI、聊天、智能助手、语音识别、音频产品。
  画面：深靛底，淡紫或柔紫光晕；声波、话筒抽象、声音球体；手机局部裁切、指令输入框、App 图标作为应用。
  Logo 方向：声波加首字母、声音球、说话路径、话筒抽象、脉冲环。
  情绪：流畅、聪明、亲密。
  避免：写实麦克风、满屏频谱、过亮的霓虹紫。
