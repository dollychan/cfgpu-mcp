# cfgpu-mcp configuration template.
#
# Copy to `config.yaml` and edit. The runtime `config.yaml` is gitignored.
# Keep all API tokens in environment variables, not here.
#
# Precedence: environment override > config.yaml > built-in defaults.
# Point at this file with the CFGPU_CONFIG env var, or place config.yaml in CWD.
#
# A gitignored `.env` in CWD (or CFGPU_DOTENV path) is auto-loaded at startup,
# so secrets like CFGPU_API_TOKEN or the DB URL behind `$DATABASE_URL` below can
# live there instead of being exported by hand. Real env vars still take priority.

transport: stdio              # stdio | streamable-http

http:                          # only used when transport=streamable-http
  host: 0.0.0.0
  port: 8080
  stateless: true              # MUST stay true for multi-tenant per-request tokens;
                               # false freezes one caller's token into the session
                               # (cross-tenant leak) and the server refuses to start.

cfgpu_api:
  base_url: https://www.cfgpu.com/userapi/v1
  http_timeout: 120            # per-request total timeout (seconds)
  connect_timeout: 10

providers:                     # extra upstreams beyond CFGPU itself; omit if you have none
  # `cfgpu` is built in and configured by the cfgpu_api block above — it does not
  # belong here. This section is for models served by something else.
  #
  # A model whose adapter.yaml declares `provider: X` is NOT REGISTERED unless X
  # appears here: it stays out of list_models and out of the tool's model enum, so
  # model="auto" can never route to a host this deployment cannot reach. Adding the
  # YAML but forgetting this block therefore looks like "the model didn't show up"
  # — the startup log says which provider is missing.
  #
  # comfy:                     # co-located comfy-gateway (MiniMax H3 local weights)
  #   base_url: https://<gateway-host>/v1
  #   auth_scheme: raw         # bare token, not `Bearer <t>` — matches that host's proxy
  #   token_env: COMFY_GATEWAY_TOKEN
  #   http_timeout: 60
  submodel:                    # hosted MiniMax H3 video API
    base_url: https://h3.submodel.ai
    auth_scheme: bearer
    token_env: SUBMODEL_API_TOKEN
    http_timeout: 120
  #
  # token_env is the ONLY source of a non-cfgpu provider's credential. Such a
  # provider never reads the per-request Authorization header (that token is the
  # caller's CFGPU credential and belongs to CFGPU alone) and never falls back to
  # CFGPU_API_TOKEN — naming CFGPU_API_TOKEN here is refused at load time.

task_db:
  url: sqlite:///~/.cfgpu/tasks.db
  # url: postgresql://user:pass@host:5432/cfgpu   # multi-instance horizontal scaling
  # url: $DATABASE_URL                            # or $VAR / ${VAR} → read from environment
  pool_min: 1                  # Postgres connection pool (ignored by SQLite)
  pool_max: 10

disabled_models:               # blacklist; omit / null / [] = load all models
  # Models listed here are not registered: they stay out of list_models, out of
  # each tool's `model` enum, and out of `model="auto"` routing. Name a model by
  # its model_name (what the tools take), or by adapter_id / cfgpu_model_id.
  #
  # A blacklist, not a whitelist: the fleet keeps growing, and a config naming
  # what to drop stays correct when a model is added — a whitelist would hide
  # every new model until someone remembered to extend it.
  #
  # Disabling a model that other models `extends:` is safe — variants inherit
  # from the YAML, not from the registered adapter.
  # - wan-2-0-fast
  # - doubao-seedream-5-0-lite

disabled_tools:                # MCP tools to not expose; omit / null / [] = all
  # Trims the tool surface this server registers, e.g. an image-only deployment
  # that shouldn't spend context on video/audio tools. A disabled tool is
  # unregistered, so calling it returns "unknown tool".
  #
  # Valid names (an unknown one fails at startup):
  #   generate_image  generate_video  generate_audio  understand_vision
  #   task_status  task_wait  list_models  get_model_card
  #
  # Note task_status / task_wait are how async generation results are collected —
  # disabling them alongside generate_video leaves callers with no way to finish
  # a task started with wait=false.
  # - generate_audio
  # - understand_vision
