content: |-
  适用：用于 Logo 系统、品牌板、VI 套件和应用样机。
  Use when: Use for logo systems, brand boards, visual identity kits, and application mockups.
  要点 / Guidance:
  - Define brand name, positioning, palette, typography, logo usage, and touchpoints.
  - Ask for a coherent board with aligned applications.
  - 定义品牌名、定位、配色、字体、Logo 用法和触点。
  - 要求视觉板中的应用统一对齐。
  避坑 / Pitfalls:
  - Avoid unrelated logo variants and inconsistent palettes.
  - Keep brand text accurate.
  - 避免无关 Logo 变体和混乱配色。
  - 保持品牌文字准确。
  可配合的模板骨架 / Skeletons: tpl-style-brand-1, tpl-style-brand-2, tpl-style-brand-3, tpl-style-brand-4, tpl-style-brand-5
