content: Transform the uploaded image into a glamorous disco-ball version of itself while preserving the original silhouette, composition, key recognizable features, and subtle tonal colors. Style it as if the subject is made from tiny mirrored square tiles, like a 1970s disco ball chrome, silver, reflective glass, beveled edges and subtle grout lines between tiles. Add bright white sparkle flares and small iridescent highlights across the mirrored surface. Use dramatic studio lighting on a pure black background, with high contrast, glossy reflections and a luxurious nightclub feel. Keep the object centered and iconic, with a polished 3D look.
