adapter_id: grok-imagine-video-1-5
display_name: "CF Imagine Video 1.5"
cfgpu_model_id: grok-imagine-video-1.5
model_name: cf-imagine-video-1.5

task_type: video
endpoint: /video/generations
is_async: true
poll_endpoint: /video/tasks/{task_id}

# Material slots this model accepts — the single source for supports(), the
# profile catalog and the consistency tests (adapters/inputs.py). An absent slot
# is not accepted.
inputs:
  first_frame: {}         # refer_images[0]
  reference_images: {}    # refer_images[1:]

# Canonical tasks (capabilities/media_tasks.yaml) — what this model can do, for
# both the code gates and the agent-facing profile catalog.
tasks:
  - text_to_video
  - image_to_video
  - reference_to_video
  - synced_audio_output

# Whether the output has sound (adapters/inputs.py AUDIO_OUTPUTS): audio on every output; no switch in the request.
outputs:
  audio: always

cost_tier: 3
speed_tier: 3
resolutions: [480p, 720p, 1080p]

poll_config:
  base_interval: 5
  max_interval: 20
  backoff_factor: 1.3
  default_timeout: 600
