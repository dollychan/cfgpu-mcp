content: |-
  15秒[题材]高燃战斗镜头，[主色调]。
  [[shot 0-3]] 低角度特写[主角]的[服饰细节]被热浪吹得猎猎飘动，双手紧握[武器]，[武器特效]持续爆闪，[环境危机]，远处[敌人]嘶吼着冲锋逼近，[主角]低喝 [[say S1: [台词1]]] [[sound: 兵器鸣响与环境声]]
  [[shot 4-8]] 环绕摇镜快切，[主角]旋身出招，[冲击效果]，前排[敌人]被击飞碎裂成灰烬。[[sound: 破空声与惨嚎]]
  [[shot 9-12]] 仰拍拉远并慢放定格，[主角]跃起腾空，[大招效果]劈向敌群，所过之处碎石与火光飞溅。
  [[shot 13-15]] 缓推特写[主角]落地收势，衣摆余波微动，[武器]残留光效闪烁，冷声道 [[say S1: [台词2]]]，镜头定格在[收尾意象]的剪影上。[[sound: 余音震颤与渐弱风声]]
