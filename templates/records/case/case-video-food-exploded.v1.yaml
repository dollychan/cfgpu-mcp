content: 将[产品参考图]中的汉堡进行拆解：镜头保持静止，汉堡悬浮在空中开始旋转，食材轻柔而精准地分离，保持形状和比例，动作流畅，无任何额外效果；汉堡向两边分开——顶部金黄色带芝麻的面包盖、鲜翠绿生菜叶、带水珠的新鲜红番茄切片、两层夹着融化切达芝士的厚实烤牛肉饼，以及最底部的松软面包底座——随后缓缓下落，完美组合成一个完整的豪华双层芝士汉堡。
