[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cfgpu-mcp"
version = "0.1.0"
description = "MCP Server for CFGPU image and video generation models"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "aiohttp>=3.9",
    "pydantic>=2.0",
    "aiosqlite>=0.19",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7",
]
cli = [
    "click>=8.0",
]

[project.scripts]
cfgpu-mcp = "cfgpu_mcp.server:main"
cfgpu = "cfgpu_mcp.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/cfgpu_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true
