extends: doubao-seedream-5-0-lite
card_base: ~

adapter_id: doubao-seedream-5-0-pro
display_name: "Doubao Seedream 5.0 Pro"
cfgpu_model_id: doubao-seedream-5-0-pro
model_name: doubao-seedream-5-0-pro

# Pro drops 组图 (multi_image_group) and 联网搜索 (web_search); n is ignored.
# It is so far the only image model that can edit a *named region*: the coordinates ride
# inside the prompt as <bbox> tags, so neither the endpoint nor the response changes.
capabilities:
  - text_to_image
  - image_to_image
  - multi_image_fusion
  - region_edit

# No documented ceiling on how many regions one image may carry, so none is enforced
# locally. Left absent rather than guessed: an invented cap would reject calls the model
# accepts, which is the one failure a local check must never add.
max_regions_per_image: ~

# cost_tier / speed_tier inherited from doubao-seedream-5-0-lite (2 / 3).
