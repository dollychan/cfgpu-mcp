content: 'I am “VIRGO.” Create a poster inspired by Yumi’s Cells with the same soft, aesthetic, slice-of-life vibe and background style, while fully reflecting the Virgo zodiac theme in the design. The subject’s face must remain completely unchanged and untouched. Surround the subject with multiple small, raw yet realistic cute chibi-style mini 3D versions of the subject, designed like expressive “cells” with oversized heads, glossy high-detail finishes, and playful emotions. Each mini character should reflect Virgo traits such as organization, perfectionism, intelligence, neatness, overthinking, helpfulness, and calm focus. Show them in different actions: one clinging onto the subject’s arm, one reading a book carefully, one writing notes or checking a list, one drinking coffee while concentrating, one lying down using a phone while researching something, one making a wacky but slightly judgmental face, one looking tired or stressed from overthinking, one tidying things up, one pointing out details, and one with slightly messy “worked too hard” hair energy. Add playful hand-drawn doodles interacting directly with the subject and chibi characters—checklists, arrows, tiny labels, sparkles, paper-note doodles, neat outline sketches, and visual reactions to their actions to enhance movement and storytelling. Use a clean aesthetic composition, white sticker outlines, soft pastel sage, cream, soft olive, dusty beige, and light blue tones, high-detail glossy 3D chibi look, cute Korean-inspired design, with a raw natural poster feel, and the Virgo identity clearly integrated into the overall concept.'
