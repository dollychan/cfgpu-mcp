content: An urban landscape illustration created in the style of a two-color Risograph print. The palette is limited to 'Fluorescent Pink' and 'Teal Blue', with a dark navy created where the two inks overlap. The image has the characteristic grainy, tactile texture of Riso printing, with visible halftones and a slight, intentional 'misregistration' where the colors don't perfectly align. The subject is a high-contrast view of a city street with fire escapes and power lines. The lighting is represented through the density of the dot patterns, creating a gritty, lo-fi aesthetic. The composition uses flat shapes and bold silhouettes, with the pink ink used for the sky and the teal for the building shadows. The mood is indie, artistic, and nostalgic for DIY zine culture. The text 'SHIFT' is printed in the bottom corner in a distorted, ink-heavy typeface.
