adapter_id: submodel-minimax-h3
display_name: "MiniMax H3 (Submodel)"
cfgpu_model_id: MiniMax-H3
model_name: submodel/minimax-h3

provider: submodel

task_type: video
endpoint: /v2/video_generation
is_async: true
poll_endpoint: /v2/query/video_generation/{task_id}

capabilities:
  - text_to_video
  - image_to_video
  - first_last_frame
  - multi_modal_reference

# Unified 720p/1080p tiers map to Submodel's 768P/2K wire values.
resolutions: [720p, 1080p]
max_duration_seconds: 15

cost_tier: 3
speed_tier: 3

poll_config:
  base_interval: 5
  max_interval: 20
  backoff_factor: 1.3
  default_timeout: 900
