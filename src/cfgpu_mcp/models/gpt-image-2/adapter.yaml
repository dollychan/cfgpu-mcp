adapter_id: gpt-image-2
display_name: "CF Image 2"
cfgpu_model_id: gpt-image-2
model_name: cf-image-2

task_type: image
endpoint: /images/generations
is_async: true
poll_endpoint: /images/tasks/{task_id}

capabilities:
  - text_to_image
  - image_to_image

cost_tier: 2
speed_tier: 3

poll_config:
  base_interval: 3
  max_interval: 15
  backoff_factor: 1.3
  default_timeout: 120
