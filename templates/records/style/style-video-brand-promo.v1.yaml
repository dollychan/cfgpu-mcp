content: |-
  适用：新品发布、官网展示、社媒推广的 15–30 秒品牌片。不适合长篇剧情片，也不适合在没有授权素材时仿造真实品牌标识。
  事实先行：LOGO、字体、品牌色、产品界面、包装、吉祥物等带身份识别的元素，只用用户提供或官方来源的原件；不重绘、不近似、不生成"看起来像"的替代品。产品名称、功能、指标、口号与官方一致，拿不准的写成概念文案并标注。
  叙事脊柱按产品类型：
  - AI / SaaS：用户意图 → 思考或规划 → 能力 → 执行 → 有用输出 → 证明 → LOGO。
  - 实体产品：英雄展示 → 交互 → 功能特写 → 使用场景 → 结果 → LOGO。
  - 服务 / 公司：背景 → 流程 → 证据 → 成果 → 承诺 → LOGO。
  - 图像主导品牌：真实影像 → 视觉母题 → 利益点 → 情绪回报 → LOGO。
  节拍：15 秒 5–8 个，30 秒 8–12 个；每个节拍写清起止时间、视觉主导元素、主要动作、展示的产品证明、文案与停留、色彩状态、入场与出场转场、动作意图（铺垫/预备/冲击/制动/稳定）。
  动效语言：由产品动作、光标路径、界面流、光线、滚动内容或物体边缘驱动转场；全片 2–5 个色彩状态；每个节拍一个主动作；2–3 个高能峰值配安静的制动时刻；LOGO 与文案保留安全区。
  避免：虚假 HUD、随意玻璃卡片、装饰性文字墙、未经证实的指标、全片同一种缓动、用抽象特效掩盖空洞的产品叙事。
  语言：旁白和画面文案按品牌受众与投放平台定，不机械跟随聊天语言。
  声音：默认用视频模型的原生音频生成品牌安全的纯音乐与界面音效；需要可替换的旁白或精确时长音乐时才单独生成，避免两条音轨重复。
