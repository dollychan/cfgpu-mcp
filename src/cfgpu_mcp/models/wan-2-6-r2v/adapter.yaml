adapter_id: wan-2-6-r2v
display_name: "万相 2.6 (参考生视频)"
cfgpu_model_id: wan2.6-r2v
model_name: wan2.6-r2v

task_type: video
resolutions: [720p, 1080p]
# Accepted aspect_ratio values (parameters.size; supports() also checks the resolution × ratio pair). adaptive is always accepted.
aspect_ratios: ["16:9", "9:16", "1:1"]
default_resolution: 720p
min_duration_seconds: 2
max_duration_seconds: 10
endpoint: /video/generations
is_async: true
poll_endpoint: /video/tasks/{task_id}

# Material slots this model accepts — the single source for supports(), the
# profile catalog and the consistency tests (adapters/inputs.py). An absent slot
# is not accepted.
inputs:
  reference_images: {max: 5}
  reference_videos: {max: 3, role: reference}

# Canonical tasks (capabilities/media_tasks.yaml) — what this model can do, for
# both the code gates and the agent-facing profile catalog.
tasks:
  - reference_to_video
  - synced_audio_output

# Whether the output has sound (adapters/inputs.py AUDIO_OUTPUTS): `audio` defaults to true; a silent video is wan2.6-r2v-flash only.
outputs:
  audio: always

cost_tier: 3
speed_tier: 2

poll_config:
  base_interval: 5
  max_interval: 20
  backoff_factor: 1.3
  default_timeout: 3000
