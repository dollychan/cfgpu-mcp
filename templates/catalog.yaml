# Template library catalog (docs/template-library-and-dialect.md §6).
#
# catalog_version: bump when a published record is removed or changes meaning (I-TL1).
# Adding records, retuning metadata, or deprecating needs no bump.
#
# The facet lists below are the closed vocabulary records may use. search_templates
# rejects any other value with this list, so keep it short and free of near-duplicates —
# two slugs for one category silently split a filter's results in half.
