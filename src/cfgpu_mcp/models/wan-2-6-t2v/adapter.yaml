adapter_id: wan-2-6-t2v
display_name: "万相 2.6 (文生视频)"
cfgpu_model_id: wan2.6-t2v
model_name: wan2.6-t2v

task_type: video
resolutions: [720p, 1080p]
default_resolution: 720p
min_duration_seconds: 2
endpoint: /video/generations
is_async: true
poll_endpoint: /video/tasks/{task_id}

# Material slots this model accepts — the single source for supports(), the
# profile catalog and the consistency tests (adapters/inputs.py). An absent slot
# is not accepted.
inputs:
  # input.audio_url: an optional driving track the picture is synced to.
  reference_audios: {max: 1, role: driving, standalone: true}

# Canonical tasks (capabilities/media_tasks.yaml) — what this model can do, for
# both the code gates and the agent-facing profile catalog.
tasks:
  - text_to_video
  - audio_driven_video

cost_tier: 3
speed_tier: 2

poll_config:
  base_interval: 5
  max_interval: 20
  backoff_factor: 1.3
  default_timeout: 3000
