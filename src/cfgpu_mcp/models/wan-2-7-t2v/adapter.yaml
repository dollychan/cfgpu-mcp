adapter_id: wan-2-7-t2v
display_name: "万相 2.7 (文生视频)"
cfgpu_model_id: wan2.7-t2v
model_name: wan2.7-t2v

task_type: video
resolutions: [720p, 1080p]
# Accepted aspect_ratio values (parameters.ratio). adaptive is always accepted.
aspect_ratios: ["16:9", "9:16", "1:1", "4:3", "3:4"]
default_resolution: 1080p
min_duration_seconds: 2
endpoint: /video/generations
is_async: true
poll_endpoint: /video/tasks/{task_id}

# Material slots this model accepts — the single source for supports(), the
# profile catalog and the consistency tests (adapters/inputs.py). An absent slot
# is not accepted.
inputs:
  # input.audio_url (reference): lip movement and motion are aligned to the track;
  # longer than the video is cut, shorter leaves the rest silent.
  reference_audios: {max: 1, role: driving, standalone: true}

# Canonical tasks (capabilities/media_tasks.yaml) — what this model can do, for
# both the code gates and the agent-facing profile catalog.
tasks:
  - text_to_video
  - audio_driven_video
  - synced_audio_output

# Whether the output has sound (adapters/inputs.py AUDIO_OUTPUTS): the supplied track, or without audio_url sound the model generates (reference: 自动生成匹配的背景音乐或音效); no switch.
outputs:
  audio: always

cost_tier: 3
speed_tier: 2

poll_config:
  base_interval: 5
  max_interval: 20
  backoff_factor: 1.3
  default_timeout: 3000
