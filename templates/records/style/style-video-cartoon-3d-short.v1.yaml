content: |-
  适用：剧情动画、生日纪念、品牌故事、社媒短片等多镜头 3D 动画。不适合单图、写实真人或只要一个孤立镜头。
  视觉风格锁：皮克斯感 3D 卡通渲染，C4D + Octane 质感，动画电影品质；高概括几何形体、强剪影；可爱角色用 2.5–3 头身 Q 版比例；毛发块面清晰、边缘保留细丝；皮肤温润次表面散射，耳朵、脸颊、鼻尖可微微透红，避免塑料感；迪士尼式夸张表演，挤压与伸展、预备动作、过冲、跟随动作，眉眼嘴脸形变丰富。
  负向：写实摄影、扁平二次元、塑料玩具皮肤、僵硬姿势、无生命表情。
  角色卡：角色名与定位标注、3/4 主视角、正侧背三视图、表情、服装与道具细节、不可改特征（年龄段、身材、发型、服饰色、签名道具）。
  场景卡：只画环境，不出现任何人物；标出连续性地标（如门框、沙发、厨房中岛）及其在画面中的位置。
  镜头规则：
  - 单镜不超过 15 秒，单镜重要角色不超过 3 个。
  - 每镜写清承接上一镜的状态（道具位置、眼神、姿态、情绪），并为下一镜留钩子。
  - 每镜标一个钩子类型：视觉笑点、反转、悬念、温情、追逐、揭示、呼应、表情节拍；每连续 3 镜至少 1 个揭示、反转或呼应。
  - 同场景连续镜头保持地标位置和光位一致，要变就写明。
  - 逐秒指令覆盖整镜，每秒写：动作/姿态/表情、镜头运动、空间位置、音频线索、交给下一秒的状态。
  - 景别在特写/大特写与其他景别之间交替；追逐、失衡、惊吓节拍用荷兰角。
  - 有旁白时写明说话人嘴部开合。
